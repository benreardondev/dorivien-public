services:
  - type: web
    name: dorivien-fresh
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: demo
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_TIMEOUT_MS
        value: 15000
